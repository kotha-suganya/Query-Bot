<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUERY BOT</title>
    <!--Tailwind CSS CDN  -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--  Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for chat history */
        #chat-history::-webkit-scrollbar {
            width: 8px;
        }
        #chat-history::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        #chat-history::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        .message-bubble {
            max-width: 85%;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Chatbot Container -->
    <div class="bg-white rounded-xl shadow-lg w-full max-w-lg flex flex-col h-[80vh]">
        <!-- Header -->
        <div class="p-4 border-b border-gray-200 bg-blue-600 rounded-t-xl text-white">
            <h1 class="text-xl font-bold">Query Bot</h1>
            <p class="text-sm text-blue-100">Talk to me!</p>
        </div>

        <!-- Chat History -->
        <div id="chat-history" class="flex-grow p-4 overflow-y-auto space-y-4">
            <!-- Initial bot message -->
            <div class="flex items-start justify-start">
                <div class="bg-blue-100 text-gray-800 p-3 rounded-lg rounded-bl-none message-bubble shadow-sm">
                    Hello! How can I help you today?
                </div>
            </div>
        </div>

        <!--  Input Form  -->
        <form id="chat-form" class="p-4 border-t border-gray-200 bg-gray-50 flex space-x-2 rounded-b-xl">
            <input type="text" id="user-input" placeholder="Type your message..."
                   class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
            <button type="submit"
                    class="bg-blue-600 text-white p-3 rounded-lg shadow-md hover:bg-blue-700 transition-colors">
                Send
            </button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatHistory = document.getElementById('chat-history');

        // Function to append a message to the chat history
        function appendMessage(message, isUser = false) {
            const messageWrapper = document.createElement('div');
            messageWrapper.classList.add('flex', 'items-start', 'whitespace-pre-wrap');

            const messageBubble = document.createElement('div');
            messageBubble.classList.add('p-3', 'rounded-lg', 'message-bubble', 'shadow-sm');

            if (isUser) {
                messageWrapper.classList.add('justify-end');
                messageBubble.classList.add('bg-blue-500', 'text-white', 'rounded-br-none');
            } else {
                messageWrapper.classList.add('justify-start');
                messageBubble.classList.add('bg-blue-100', 'text-gray-800', 'rounded-bl-none');
            }
            messageBubble.textContent = message;
            messageWrapper.appendChild(messageBubble);
            chatHistory.appendChild(messageWrapper);
            chatHistory.scrollTop = chatHistory.scrollHeight; // Auto-scroll to the latest message
        }

        // Handle form submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userMessage = userInput.value.trim();
            if (!userMessage) return;

            // Display user's message
            appendMessage(userMessage, true);
            userInput.value = '';

            try {
                // Send message to the backend
                const response = await fetch('http://127.0.0.1:5000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: userMessage })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                // Display the bot's response
                appendMessage(data.response, false);

            } catch (error) {
                console.error("Error sending message:", error);
                appendMessage("Sorry, there was an error processing your request.", false);
            }
        });
    </script>
</body>
</html>
